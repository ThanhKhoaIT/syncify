name: Release

# Auto-bumps the patch version, tags, publishes a GitHub release, and points
# Formula/syncify.rb at the new tag on every push to main. Pushes made by
# this workflow's own GITHUB_TOKEN don't trigger a new `push` event (GitHub's
# built-in loop guard), so it doesn't re-run itself — the actor/message
# checks below are just an extra safety net in case that ever doesn't hold
# (e.g. a PAT gets swapped in for GITHUB_TOKEN later).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip release]"

      - name: Tag
        run: git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"

      - name: Push commit and tag
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Point formula at new tag
        run: |
          revision=$(git rev-parse HEAD)
          version="${{ steps.bump.outputs.version }}"
          sed -i -E "s/tag: \"v[0-9]+\.[0-9]+\.[0-9]+\", revision: \"[0-9a-f]+\"/tag: \"v${version}\", revision: \"${revision}\"/" Formula/syncify.rb
          git add Formula/syncify.rb
          git commit -m "Point formula at v${version} [skip release]"
          git push origin HEAD:main
